# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 14:00 UTC
    - cron: 0 14 * * *
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check HOMEBREW_TAP_TOKEN is set
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]
          then
            echo "::error::Add the HOMEBREW_TAP_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          core: true

      - name: Install Python used by tap formulae
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          mapfile -t formulae < <(brew tap-info --json "$TAP_NAME" | jq -r '.[0].formula_names[]')
          mapfile -t pythons < <(brew deps --direct --union "${formulae[@]}" | grep -E '^python(@[0-9.]+)?$' || true)
          if [[ "${#pythons[@]}" -gt 0 ]]
          then
            brew install "${pythons[@]}"
          fi

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"
